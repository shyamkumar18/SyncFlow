name: syncflow_app
description: SyncFlow - Track your bank transactions directly from Gmail.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.4.3+1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  flutter_appauth: ^8.0.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  timeago: ^3.7.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  material_color_utilities: ^0.11.1
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.2.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.9
  freezed: ^2.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
